{% extends "base.html" %}

{% block styles %}
  {{ super() }}
  <style>
    /* ================= MISE EN PAGE PAPIER ================= */

    /* Cacher le chrome du site */
    .md-header, .md-tabs, .md-sidebar, .md-footer,
    .md-top, .md-content__button {
      display: none !important;
    }

    /* Paged.js maîtrise les dimensions : on ne contraint rien */
    .md-grid, .md-content, .md-content__inner {
      max-width: none !important;
      width: auto !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Fond de "bureau" neutre autour des feuilles (écran) */
    body { background: #e9e9ec !important; }
    .pagedjs_pages { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    .pagedjs_page { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); }

    /* ================= TYPOGRAPHIE ================= */
    .md-typeset {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino,
                   "Book Antiqua", Georgia, serif;
      font-size: 10.5pt;
      line-height: 1.6;
      hyphens: auto;
      -webkit-hyphens: auto;
    }
    html, body { background: #fff !important; }
    .md-typeset, .md-typeset p, .md-typeset li { color: #1a1a1a !important; }
    .md-typeset p {
      text-align: justify;
      margin-top: 0;
      margin-bottom: 0.45em;
      orphans: 2; widows: 2;
    }
    .md-typeset li { margin-bottom: 0.25em; }

    /* ---- Titres : hiérarchie claire, encadrés de chapitre ---- */
    .md-typeset h1 {
      font-size: 1.7rem;
      line-height: 1.25;
      margin: 0 0 1.2rem 0;
      padding-bottom: 0.5rem;
      border-bottom: 2.5px solid #4051b5;
      color: #2b3674;
    }
    .md-typeset h2 {
      font-size: 1.25rem;
      margin-top: 1.8rem;
      margin-bottom: 0.6rem;
      color: #2b3674;
    }
    .md-typeset h3 {
      font-size: 1.05rem;
      margin-top: 1.4rem;
      margin-bottom: 0.4rem;
      color: #333;
    }
    .md-typeset h4, .md-typeset h5, .md-typeset h6 {
      font-size: 1rem; color: #444;
      margin-top: 1.1rem; margin-bottom: 0.3rem;
    }
    .md-typeset code, .md-typeset pre { font-size: 0.85em; }
    .md-typeset pre {
      background: #f5f5f2 !important;
      border: 1px solid #ddd;
      border-left: 3px solid #4051b5;
      border-radius: 2px;
      padding: 0.7em 0.9em !important;
    }
    .md-typeset :not(pre) > code {
      background: #f0f0ec;
      border: 1px solid #e0e0dc;
      padding: 0.08em 0.3em;
      border-radius: 2px;
    }

    /* ---- Admonitions : encadrés sobres pour le papier ---- */
    .md-typeset .admonition {
      border-radius: 3px;
      border: 1px solid #ccc;
      border-left: 3.5px solid #4051b5;
      box-shadow: none;
      font-size: 0.95em;
      page-break-inside: avoid;
    }
    .md-typeset .admonition-title { font-weight: bold; }

    /* ---- Tableaux : lignes nettes, en-tête grisé ---- */
    .md-typeset table {
      width: 100% !important;
      font-size: 9.5pt;
      border-collapse: collapse;
    }
    .md-typeset table th {
      background: #ececf2 !important;
      border-bottom: 1.5px solid #999 !important;
      color: #222 !important;
    }
    .md-typeset table td { border-bottom: 1px solid #ddd !important; }
    .md-typeset table:not([class]) th,
    .md-typeset table:not([class]) td {
      border-left: none; border-right: none; border-top: none;
      padding: 0.35em 0.6em;
    }

    /* ---- Images ---- */
    .md-typeset img { max-width: 100% !important; break-inside: avoid; }
    .md-typeset figure { break-inside: avoid; margin: 0.8em 0; }

    /* ---- Blocs code : pas de débordement ---- */
    .md-typeset pre, .md-typeset code {
      white-space: pre-wrap !important;
      word-break: break-word;
    }

    /* ---- Boutons authoring : style sobre à l'impression ---- */
    .md-typeset .md-button {
      border: 1.5px solid #4051b5 !important;
      color: #4051b5 !important;
      background: #fff !important;
      font-size: 0.9em;
    }
    .md-typeset .md-button--primary {
      background: #4051b5 !important;
      color: #fff !important;
    }

    /* ---- Liens : sobre, URL visible en print ---- */
    .md-typeset a { color: #1a5fb4 !important; text-decoration: none; }

    /* ================= PAGE DE GARDE ================= */
    .print-cover {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      height: 250mm;
      page-break-after: always;
      break-after: page;
    }
    .print-cover h1 {
      font-size: 3rem;
      border: none;
      margin: 0 0 0.6rem 0;
      color: #2b3674;
      letter-spacing: 0.02em;
    }
    .print-cover p {
      text-align: center !important;
      margin: 0.25rem 0;
      font-size: 1.05rem;
    }
    .print-cover img.print-cover-logo { width: 110px; margin-top: 2.4rem; }

    /* ================= SOMMAIRE ================= */
    .print-toc {
      page-break-before: always;
      break-before: page;
    }
    .print-toc ul { list-style: none; padding-left: 0; margin: 0; }
    .print-toc li { margin: 0; padding: 0; }
    .print-toc > ul { counter-reset: tocchap; }

    /* niveau 1 : chapitres */
    .print-toc > ul > li {
      font-weight: bold;
      margin-top: 0.75rem;
      counter-increment: tocchap;
    }
    .print-toc > ul > li > a::before {
      content: counter(tocchap) ". ";
      color: #4051b5;
    }
    /* niveau 2 : sous-sections */
    .print-toc > ul > li > ul {
      padding-left: 1.7rem;
      font-weight: normal;
    }
    /* ligne titre ...... n° */
    .print-toc li a {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      text-decoration: none;
      color: inherit;
    }
    .print-toc li a::after {
      content: target-counter(attr(href url), page);
      margin-left: auto;
      font-weight: normal;
      font paragraph-height: 0;
      font-size: 0.9em;
      color: #444;
    }
    .print-toc li::after {
      content: "";
      display: block;
      margin-top: -0.75em;
      border-bottom: 1px dotted #999;
    }

    /* chaque chapitre démarre sur une nouvelle page */
    h1[id]:not([id="top"]):not([id="sommaire"]) {
      break-before: page;
      page-break-before: always;
    }

    /* pas de titre orphelin en bas de page */
    h1, h2, h3 { break-after: avoid; page-break-after: avoid; }
    h1, h2, h3, h4, h5, h6,
    table, figure, blockquote, .admonition {
      break-inside: avoid; page-break-inside: avoid;
    }

    /* ================= PAGINATION ================= */
    @page {
      size: A4;
      margin: 22mm 19mm 24mm 19mm;   /* marge basse plus grande : footer */
      @bottom-center {
        content: counter(page) " / " counter(pages);
        font-family: "Palatino Linotype", Palatino, Georgia, serif;
        font-size: 8.5pt;
        color: #777;
      }
      @bottom-right {
        content: "QualCoder — Documentation";
        font-family: "Palatino Linotype", Palatino, Georgia, serif;
        font-size: 7.5pt;
        color: #999;
      }
    }
    @page :first {
      margin-top: 0;                 /* couverture pleine hauteur */
      @bottom-center { content: none; }
      @bottom-right { content: none; }
    }

    /* ================= IMPRESSION (Ctrl+P) ================= */
    @media print {
      /* Les feuilles Paged.js embarquent déjà les marges : le navigateur
         n'en rajoute pas. */
      @page { size: A4; margin: 0; }
      html, body { background: #fff !important; }
      .pagedjs_pages { gap: 0 !important; display: block !important; }
      .pagedjs_page {
        margin: 0 !important;
        box-shadow: none !important;
        break-after: page;      /* une feuille HTML = une feuille papier */
      }
    }  </style>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    const expandAll = () => {
      document.querySelectorAll('details').forEach(d => { d.open = true; });
      document.querySelectorAll('.tabbed-set input[type="radio"]')
        .forEach(r => { r.checked = false; });
    };
    window.addEventListener('beforeprint', expandAll);
    document.addEventListener('DOMContentLoaded', expandAll);
  </script>
  <script>
    window.PagedConfig = {
      auto: false,
      after: () => expandAll(),
    };
    document.addEventListener('DOMContentLoaded', () => {
      const content = document.querySelector('.md-content__inner');
      window.PagedPolyfill.preview(content ?? document.body, window.PagedConfig)
        .catch(err => console.error('paged.js:', err));
    });
  </script>
  <script src="https://unpkg.com/pagedjs/dist/paged.polyfill.js"></script>
  <script>
    // Si Paged.js n'a pas paginé (CDN bloqué, erreur), réinjecter des
    // marges de page pour que l'impression reste lisible.
    window.addEventListener('beforeprint', () => {
      if (!document.querySelector('.pagedjs_page')) {
        const style = document.createElement('style');
        style.textContent = '@page { size: A4; margin: 20mm 18mm 22mm 18mm; }';
        document.head.appendChild(style);
      }
    });
  </script>
{% endblock %}
